Screens:
  scr_Home:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(gbl_Timeframe, Coalesce(gbl_Timeframe, "Month"));
        Set(gbl_FilterType, Coalesce(gbl_FilterType, "All"));
        Refresh(tbl_Transactions);
        Refresh(tbl_Categories);
        Refresh(tbl_Accounts);
        Refresh(tbl_Budgets);
        ClearCollect(col_Transactions, tbl_Transactions);
        ClearCollect(col_Categories, tbl_Categories);
        ClearCollect(col_Accounts, tbl_Accounts);
        ClearCollect(col_Budgets, tbl_Budgets);
        ClearCollect(
            col_FilteredTx,
            Filter(
                col_Transactions,
                Switch(
                    gbl_Timeframe,
                    "Day", DateValue(Text(TransactionDate)) = Today(),
                    "Week", DateValue(Text(TransactionDate)) >= Today() - Weekday(Today(), StartOfWeek.Monday) + 1 &&
                            DateValue(Text(TransactionDate)) <= Today() - Weekday(Today(), StartOfWeek.Monday) + 7,
                    "Month", Month(DateValue(Text(TransactionDate))) = Month(Today()) &&
                             Year(DateValue(Text(TransactionDate))) = Year(Today()),
                    "3M", DateValue(Text(TransactionDate)) >= DateAdd(Today(), -3, TimeUnit.Months),
                    "6M", DateValue(Text(TransactionDate)) >= DateAdd(Today(), -6, TimeUnit.Months),
                    "1Y", DateValue(Text(TransactionDate)) >= DateAdd(Today(), -1, TimeUnit.Years),
                    true
                )
            )
        );
    Children:
      - btn_Tf1Y:
          Control: Classic/Button@2.2.0
          Group: grp_Timeframe
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =152
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Set(gbl_Timeframe, "1Y");
              Select(btn_RefreshTimeframe);
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="1Y"
            Width: =120
            X: =520
            Y: =149
