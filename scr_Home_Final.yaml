                  Font: =Font.'Open Sans'
                  OnSelect: =Set(gbl_FilterType, "Income");
                  Text: |-
                    =gbl_CurrencySymbol & Text(
                        Sum(
                            Filter(
                                col_FilteredTx,
                                TransactionType = "Income"
                            ),
                            Amount
                        ),
                        "#,##0.00"
