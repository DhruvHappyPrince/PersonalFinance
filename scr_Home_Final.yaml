            - lbl_NetVal:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  OnSelect: =Set(gbl_FilterType, "All");
                  Text: |-
                    =With(
                        {
                            inc: Sum(
                                Filter(col_FilteredTx, TransactionType = "Income"),
                                Amount
                            ),
                            exp: Sum(
                                Filter(col_FilteredTx, TransactionType = "Expense"),
                                Amount
                            )
                        },
                        If(inc - exp < 0, "-", "") &
                        gbl_CurrencySymbol &
                        Text(Abs(inc - exp), "#,##0.00")
                    )
                  Width: =500
                  Y: =30
      - lbl_BudgetSummary:
