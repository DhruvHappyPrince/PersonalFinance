            Width: =640
            Y: =670
      - gal_BudgetSummary:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =150
            Items: |-
              =SortByColumns(
                  Filter(
                      col_Budgets,
                      Upper(Text(IsActive)) = "TRUE"
                  ),
                  "BudgetMonth",
                  SortOrder.Descending
              )
            TemplateSize: =72
            Y: =715
          Children:
            - lbl_BudgetCategoryName:
                Control: Label@2.5.1
                Properties:
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  OnSelect: =Select(Parent)
                  Text: =Coalesce(LookUp(col_Categories, CategoryId = ThisItem.CategoryId).CategoryName, "Unassigned category")
                  Width: =Parent.TemplateWidth - 24
                  X: =12
                  Y: =4
            - lbl_BudgetMonthAmount:
                Control: Label@2.5.1
                Properties:
                  Font: =Font.'Open Sans'
                  Height: =20
                  OnSelect: =Select(Parent)
                  Size: =11
                  Text: =ThisItem.BudgetMonth & "  |  Limit " & gbl_CurrencySymbol & Text(ThisItem.BudgetAmount, "#,##0.00")
                  Width: =Parent.TemplateWidth - 24
                  X: =12
                  Y: =25
            - lbl_BudgetSpent:
                Control: Label@2.5.1
                Properties:
                  Font: =Font.'Open Sans'
                  Height: =20
                  OnSelect: =Select(Parent)
                  Size: =10
                  Text: |-
                    =With(
                        {
                            spent: Sum(
                                Filter(
                                    col_Transactions,
                                    TransactionType = "Expense" &&
                                    CategoryId = ThisItem.CategoryId &&
                                    Text(DateValue(Text(TransactionDate)), "[$-en-US]yyyy-mm") = ThisItem.BudgetMonth
                                ),
                                Amount
                            ),
                            budgetLimit: Value(ThisItem.BudgetAmount)
                        },
                        "Spent: " & gbl_CurrencySymbol & Text(spent, "#,##0.00") &
                        " of " & gbl_CurrencySymbol & Text(budgetLimit, "#,##0.00") &
                        "  (" & Text(If(budgetLimit > 0, Round(spent / budgetLimit * 100, 1), 0)) & "%)"
                    )
                  Width: =Parent.TemplateWidth - 24
                  X: =12
                  Y: =45
      - gal_Transactions:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =200
            Items: |-
              =SortByColumns(
                  Filter(
                      col_FilteredTx,
                      gbl_FilterType = "All" ||
                      TransactionType = gbl_FilterType
                  ),
                  "TransactionDate",
                  SortOrder.Descending
              )
            OnSelect: |-
              =Set(gbl_SelectedTx, ThisItem);
              Navigate(scr_TransactionForm, ScreenTransition.Cover);
            TemplateSize: =188
            Y: =920
          Children:
            - lbl_TxCategory:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: |-
                    =Coalesce(
                        LookUp(
                            col_Categories,
                            CategoryId = ThisItem.CategoryId
                        ).CategoryName,
                        "Uncategorized"
                    )
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 173
                  X: =103
                  Y: =(Parent.TemplateHeight - (Self.Size * 1.8 + lbl_TxMeta.Size * 1.8)) / 2
            - lbl_TxMeta:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: |-
                    =Coalesce(
                        LookUp(
                            col_Accounts,
                            AccountId = ThisItem.AccountId
                        ).AccountName,
                        "Account"
                    ) &
                    " • " &
                    Text(
                        DateValue(Text(ThisItem.TransactionDate)),
                        "dd/mm/yyyy"
                    )
                  VerticalAlign: =VerticalAlign.Top
                  Width: =lbl_TxCategory.Width
                  X: =lbl_TxCategory.X
                  Y: =lbl_TxCategory.Y + lbl_TxCategory.Height
            - lbl_TxAmount:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: |-
                    =If(
                        ThisItem.TransactionType = "Expense",
                        Color.Red,
                        Color.Green
                    )
                  Font: =Font.'Open Sans'
                  Height: =59
                  OnSelect: =Select(Parent)
                  Text: |-
                    =If(
                        ThisItem.TransactionType = "Expense",
                        "-",
                        "+"
                    ) &
                    gbl_CurrencySymbol &
                    Text(
                        ThisItem.Amount,
                        "#,##0.00"
                    )
                  Width: =193
                  X: =423
                  Y: =57
            - lbl_TxNotes:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =59
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.Notes
                  Width: =309
                  X: =103
                  Y: =95
            - btn_EditTx:
                Control: Classic/Button@2.2.0
                Properties:
                  Color: =Color.White
                  Fill: =RGBA(56, 96, 178, 1)
                  Font: =Font.'Open Sans'
                  Height: =34
                  OnSelect: |-
                    =Set(
                        gbl_SelectedTx,
                        {
                            TransactionId: ThisItem.TransactionId,
                            TransactionType: ThisItem.TransactionType,
                            Amount: Value(ThisItem.Amount),
                            TransactionDate: DateValue(Text(ThisItem.TransactionDate)),
                            CategoryId: ThisItem.CategoryId,
                            AccountId: ThisItem.AccountId,
                            Notes: Coalesce(ThisItem.Notes, "")
                        }
                    );
                    Navigate(scr_TransactionForm, ScreenTransition.Cover);
                  Text: ="Edit"
                  Width: =72
                  X: =Parent.TemplateWidth - 88
                  Y: =8
