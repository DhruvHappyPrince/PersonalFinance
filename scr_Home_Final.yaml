      - con_Income:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Group: grp_Financial Summary
          Properties:
            Height: =100
            Width: =640
            Y: =338
          Children:
            - lbl_IncomeTitle:
                Control: Label@2.5.1
